<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 - Bootstrap columns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .my-box{
      background-color: blue;
      color: white;
      padding: 30px 20px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container mt-4">
    <h2 class="mb-4">Task 2: Bootstrap Responsive Columns</h2>

    <div class="row g-3">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="my-box">Column 1</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="my-box">Column 2</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="my-box">Column 3</div>
      </div>

    </div>
  </div>

</body>
</html>
