<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 0 - Responsive Typography</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      padding: 20px;
      line-height: 1.6;
    }

    h1{
      font-size: 20px;
      color: black;
    }

    p{
      font-size: 14px;
      color: black;
    }

    @media (min-width: 768px){
      h1 {
        font-size: 32px;
      }
      p {
        font-size: 18px;
      }
    }

    @media (min-width: 1024px){
      h1 {
        font-size: 48px;
      }
      p {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <h1>Responsive Typography Title</h1>
  <p>
    This is a paragraph demonstrating responsive typography. 
    Resize your browser window to see how the font size changes for mobile, tablet, and desktop screens.
  </p>

</body>
</html>
